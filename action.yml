name: "AnswerTrace"

description: "Generate a GitHub Discussions impact widget for README profiles."

author: "Antonis Loukis"

inputs:
  username:
    description: "GitHub username whose Discussion activity will be analyzed."
    required: true

  token:
    description: "GitHub token used to query Discussion activity."
    required: true

  output:
    description: "Path where the generated SVG will be written."
    required: false
    default: "assets/discussion-impact.svg"

  accent:
    description: "Accent color used by the widget."
    required: false
    default: "#58A6FF"

runs:
  using: "composite"

  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install AnswerTrace
      shell: bash
      run: |
        python -m pip install "$GITHUB_ACTION_PATH"

    - name: Generate Discussion widget
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ANSWERTRACE_USERNAME: ${{ inputs.username }}
        ANSWERTRACE_OUTPUT: ${{ inputs.output }}
        ANSWERTRACE_ACCENT: ${{ inputs.accent }}
      run: |
        answertrace "$ANSWERTRACE_USERNAME" \
          --svg \
          --output "$ANSWERTRACE_OUTPUT" \
          --accent "$ANSWERTRACE_ACCENT"

branding:
  icon: "message-circle"
  color: "blue"          