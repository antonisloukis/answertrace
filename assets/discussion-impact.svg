    </defs>

    <style>
        .title {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Helvetica,
                Arial,
                sans-serif;
            font-size: 15px;
            font-weight: 400;
            fill: #58A6FF;
        }

        .value {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Helvetica,
                Arial,
                sans-serif;
            font-size: 20px;
            font-weight: 600;
            fill: #F0F6FC;
        }

        .label {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Helvetica,
                Arial,
                sans-serif;
            font-size: 11px;
            font-weight: 400;
            fill: #8B949E;
        }

        .community {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Helvetica,
                Arial,
                sans-serif;
            font-size: 15px;
            font-weight: 500;
            fill: #F0F6FC;
        }
    </style>

