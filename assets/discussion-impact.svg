<svg
    xmlns="http://www.w3.org/2000/svg"
    width="720"
    height="190"
    viewBox="0 0 720 190"
    role="img"
    aria-labelledby="title description"
>
    <title id="title">GitHub Discussions Impact</title>

    <desc id="description">
        GitHub Discussions contribution statistics.
    </desc>

    <defs>
        <clipPath id="octocat-clip">
            <circle cx="0" cy="0" r="24" />
        </clipPath>
    </defs>

    <style>

        .title {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Helvetica,
                Arial,
                sans-serif;

            font-size: 15px;
            font-weight: 500;
            fill: #58A6FF;
        }

        .value {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Helvetica,
                Arial,
                sans-serif;

            font-size: 20px;
            font-weight: 600;
            fill: #F0F6FC;
        }

        .label {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Helvetica,
                Arial,
                sans-serif;

            font-size: 11px;
            font-weight: 400;
            fill: #8B949E;
        }

        .community {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Helvetica,
                Arial,
                sans-serif;

            font-size: 15px;
            font-weight: 600;
            fill: #F0F6FC;
        }

    </style>


    <!-- ===================================================== -->
    <!-- TITLE -->
    <!-- ===================================================== -->

    <text
        x="20"
        y="26"
        class="title"
    >
        GitHub Discussions Impact
    </text>


    <!-- ===================================================== -->
    <!-- LEFT: ACCEPTED ANSWERS -->
    <!-- ===================================================== -->

    <text
        x="80"
        y="83"
        text-anchor="middle"
        class="value"
    >
        1
    </text>

    <text
        x="80"
        y="102"
        text-anchor="middle"
        class="label"
    >
        Accepted Answers
    </text>


    <!-- ===================================================== -->
    <!-- LEFT: TOTAL UPVOTES -->
    <!-- ===================================================== -->

    <text
        x="210"
        y="83"
        text-anchor="middle"
        class="value"
    >
        19
    </text>

    <text
        x="210"
        y="102"
        text-anchor="middle"
        class="label"
    >
        Total Upvotes
    </text>


    <!-- ===================================================== -->
    <!-- CENTER: GITHUB BADGE -->
    <!-- ===================================================== -->

    <g transform="translate(360 84)">

        <!-- outer blue ring -->
        <circle
            cx="0"
            cy="0"
            r="34"
            fill="none"
            stroke="#58A6FF"
            stroke-width="4"
        />

        <!-- inner light circle -->
        <circle
            cx="0"
            cy="0"
            r="28"
            fill="#E6EDF3"
        />

        <!-- GitHub mark clipped inside -->
        <g clip-path="url(#octocat-clip)">
            <g
                transform="translate(-23.0 -23.0) scale(2.92)"
                fill="#0D1117"
            >
                <path d="
                    M8 0
                    C3.58 0 0 3.58 0 8
                    c0 3.54 2.29 6.53 5.47 7.59
                    .4.07.55-.17.55-.38
                    0-.19-.01-.82-.01-1.49
                    C3.78 14.2 3.31 13.18 3.31 13.18
                    c-.36-.92-.88-1.17-.88-1.17
                    -.72-.49.05-.48.05-.48
                    .8.06 1.22.82 1.22.82
                    .71 1.21 1.87.86 2.33.66
                    .07-.52.28-.86.51-1.06
                    -1.78-.2-3.64-.89-3.64-3.95
                    0-.87.31-1.59.82-2.15
                    -.08-.2-.36-1.02.08-2.12
                    0 0 .67-.21 2.2.82
                    A7.65 7.65 0 0 1 8 4.27
                    c.68 0 1.36.09 2 .27
                    1.53-1.04 2.2-.82 2.2-.82
                    .44 1.1.16 1.92.08 2.12
                    .51.56.82 1.27.82 2.15
                    0 3.07-1.87 3.75-3.65 3.95
                    .29.25.54.73.54 1.48
                    0 1.07-.01 1.93-.01 2.2
                    0 .21.15.46.55.38
                    A8.013 8.013 0 0 0 16 8
                    c0-4.42-3.58-8-8-8
                    z
                " />
            </g>
        </g>

    </g>


    <!-- ===================================================== -->
    <!-- RIGHT: TOP COMMUNITY -->
    <!-- ===================================================== -->

    <text
        x="500"
        y="83"
        text-anchor="middle"
        class="community"
    >
        GitHub Community
    </text>

    <text
        x="500"
        y="102"
        text-anchor="middle"
        class="label"
    >
        Top Community
    </text>


    <!-- ===================================================== -->
    <!-- RIGHT: FIRST ACCEPTED -->
    <!-- ===================================================== -->

    <text
        x="640"
        y="83"
        text-anchor="middle"
        class="value"
    >
        Aug 2026
    </text>

    <text
        x="640"
        y="102"
        text-anchor="middle"
        class="label"
    >
        First Accepted
    </text>


    <!-- ===================================================== -->
    <!-- SUBTLE BOTTOM DIVIDER -->
    <!-- ===================================================== -->

    <line
        x1="20"
        y1="155"
        x2="700"
        y2="155"
        stroke="#8B949E"
        stroke-width="0.5"
        opacity="0.25"
    />

</svg>
