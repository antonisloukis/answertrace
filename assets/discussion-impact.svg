    <title id="title">GitHub Discussions Impact</title>

    <desc id="description">
        GitHub Discussions contribution statistics.
    </desc>

    <defs>
        <clipPath id="octocat-inner-clip">
            <circle cx="0" cy="0" r="24.5" />
